# Source registry (spec §4). Adding a seller is a config change, not a code
# change. `module` points at src/sources/<module>.py exposing a `SOURCE` class.
# Sources without an implemented module are skipped (Phase 2 fills these in).
#
# fields:
#   id      unique source_id (matches schema)
#   seller  who actually ships
#   venue   own_site | magalu | amazon | ml | americanas
#   tier    1 and 2 every poll (2 = arbitrage), 3 only with --daily
#   url     listing/category URL
#   module  scraper module name (null until implemented)
#   enabled false = skipped by poll and heartbeat (config kept for later)
#   every   N = poll on every Nth loop iteration only (default 1)
#   default_grade  condition for a buybox that names none (new units: Novo)
#
# Amazon-only mode (Oct 2026): the user buys on amazon.com.br in 12x, so every
# other source is disabled. Flip `enabled` back (or delete the line) to revive one.

sources:
  # --- Tier 1: confirmed to stock SM-S938B 256GB ---
  - id: trocafy_site
    seller: Trocafy
    venue: own_site
    tier: 1
    enabled: false
    url: https://www.trocafy.com.br/smartphone/samsung/galaxy-s25-ultra/
    module: trocafy          # price leader, cleanest target
    notes: iSET platform; category server-rendered with prices in HTML
    match:                   # target filter (spec §1); widen colors to see more
      storage_gb: 256
      colors: [preto, jetblack]

  - id: trocafone_site
    seller: Trocafone
    venue: own_site
    tier: 1
    enabled: false
    url: https://www.trocafone.com.br/samsung-galaxy-s25-ultra-256gb/p
    module: trocafone        # VTEX public catalog API — cleanest source
    notes: VTEX; scraper hits /api/catalog_system/pub/products/search
    match:
      storage_gb: 256
      colors: [preto, jetblack]

  - id: outletdocelular
    seller: Outlet do Celular
    venue: own_site
    tier: 1
    enabled: false
    url: https://www.outletdocelular.com.br/celular-samsung/s25-ultra
    category_url: https://www.outletdocelular.com.br/celular-samsung/s25-ultra
    module: outletdocelular  # Tray; category -> per-product JSON-LD + price box
    notes: 6-month warranty (best in class); each color+condition is a separate product
    match:
      storage_gb: 256
      colors: [preto, jetblack]

  - id: amazon_seminovos
    seller: Amazon Seminovos
    venue: amazon
    tier: 1
    url: https://www.amazon.com.br/dp/B0FTMQQ7L2
    asin: B0FTMQQ7L2
    module: amazon           # direct fetch w/ browser headers; raises on captcha
    notes: robots-hostile; may captcha from CI datacenter IP (surfaced as failure)
    match:
      storage_gb: 256
      colors: [preto, jetblack]

  - id: amazon_seminovos_512
    seller: Amazon Seminovos
    venue: amazon
    tier: 1
    url: https://www.amazon.com.br/dp/B0FTMWWS8Y
    asin: B0FTMWWS8Y
    module: amazon           # same scraper; 512GB Titânio Preto child of the family
    notes: same ASIN family as B0FTMQQ7L2; separate product page + offers panel
    match:
      storage_gb: 512
      colors: [preto, jetblack]

  - id: mercadolivre_recond
    seller: Mercado Livre
    venue: ml
    tier: 1
    enabled: false
    url: https://lista.mercadolivre.com.br/samsung-galaxy-s25-ultra-256gb_recondicionado
    module: null
    notes: prefer "recondicionado pela marca" (1yr warranty)

  # --- Tier 2: same sellers, different coupon stacks (arbitrage) ---
  - id: magalu_trocafone
    seller: Trocafone
    venue: magalu
    tier: 2
    enabled: false
    url: https://www.magazineluiza.com.br/
    module: null

  - id: magalu_trocafy
    seller: Trocafy
    venue: magalu
    tier: 2
    enabled: false
    url: https://www.magazineluiza.com.br/
    module: null

  - id: ml_trocafone
    seller: Trocafone
    venue: ml
    tier: 2
    enabled: false
    url: https://www.mercadolivre.com.br/
    module: null

  - id: ml_trocafy
    seller: Trocafy
    venue: ml
    tier: 2
    enabled: false
    url: https://www.mercadolivre.com.br/
    module: null

  - id: americanas
    seller: Americanas
    venue: americanas
    tier: 2
    enabled: false
    url: https://www.americanas.com.br/busca/galaxy-s25-ultra-256gb
    search_url: https://www.americanas.com.br/busca/galaxy-s25-ultra-256gb
    module: americanas        # Playwright-rendered; captures "Usado:" refurb listings
    notes: renders client-side; seller (e.g. Trocafone) parsed per listing
    match:
      storage_gb: 256
      colors: [preto, jetblack]

  # --- Tier 3: low hit rate, poll daily ---
  - id: samsung_br_outlet
    seller: Samsung BR
    venue: own_site
    tier: 3
    enabled: false
    url: https://www.samsung.com/br/shop/
    module: null

  # --- Amazon NEW units (Oct 2026 market study: a new black 256GB sold at
  # R$ 3.543 with coupon SMART900 on 2026-10-08, and Amazon Quase Novo puts
  # "Usado - Como novo" units on the new listing). AOD headings: "Novo" ->
  # rank 5, "Usado - Como novo" -> 4; the dp names no condition, hence
  # default_grade. `every: 2` polls them on every 2nd loop iteration so one
  # poll stays at <= 6 ASINs x 2 requests.
  - id: amazon_novo_256_preto
    seller: Amazon
    venue: amazon
    tier: 1
    every: 2
    url: https://www.amazon.com.br/dp/B0DSYJCY45
    asin: B0DSYJCY45
    module: amazon
    default_grade: Novo
    notes: new 256GB Titânio Preto
    match:
      storage_gb: 256
      colors: [preto, jetblack]

  - id: amazon_novo_256_jetblack
    seller: Amazon
    venue: amazon
    tier: 1
    every: 2
    url: https://www.amazon.com.br/dp/B0F1HDQSQG
    asin: B0F1HDQSQG
    module: amazon
    default_grade: Novo
    notes: new 256GB Titânio JetBlack
    match:
      storage_gb: 256
      colors: [preto, jetblack]

  - id: amazon_novo_512_preto
    seller: Amazon
    venue: amazon
    tier: 1
    every: 2
    url: https://www.amazon.com.br/dp/B0DSXZ4FZT
    asin: B0DSXZ4FZT
    module: amazon
    default_grade: Novo
    notes: new 512GB Titânio Preto
    match:
      storage_gb: 512
      colors: [preto, jetblack]

  - id: amazon_novo_512_jetblack
    seller: Amazon
    venue: amazon
    tier: 1
    every: 2
    url: https://www.amazon.com.br/dp/B0DTMCLTKV
    asin: B0DTMCLTKV
    module: amazon
    default_grade: Novo
    notes: new 512GB Titânio JetBlack
    match:
      storage_gb: 512
      colors: [preto, jetblack]
