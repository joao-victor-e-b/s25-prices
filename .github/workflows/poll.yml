name: poll

on:
  schedule:
    - cron: '17 * * * *'   # hourly poll at an odd offset (spec §8)
    - cron: '0 12 * * *'   # 09:00 BRT (UTC-3): heartbeat + daily tier-3 sweep
  workflow_dispatch:
    inputs:
      mode:
        description: "poll | heartbeat | test"
        default: poll

permissions:
  contents: write          # needed to commit the DB back

concurrency:
  group: s25-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      CALLMEBOT_PHONE:  ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      NTFY_TOPIC:       ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Hourly poll
        if: github.event.schedule == '17 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'poll')
        run: python -m src.run --poll

      - name: Daily (tier-3 sweep + heartbeat)
        if: github.event.schedule == '0 12 * * *'
        run: |
          python -m src.run --poll --daily
          python -m src.run --heartbeat

      - name: Test alert
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python -m src.run --test-alert

      - name: Commit price snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          git commit -m "data: price snapshot $(date -u +%FT%TZ)" || echo "no changes"
          git push
