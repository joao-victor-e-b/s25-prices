name: poll

on:
  schedule:
    # Free-tier-safe: ~49 runs/day (~1500 billed min/mo, under the 2000 free tier).
    - cron: '13,43 * * * *'   # every 30 min: tier-1 refurb poll (fast, no promos)
    - cron: '0 12 * * *'      # 09:00 BRT (UTC-3): full sweep (all tiers + promos) + heartbeat
  workflow_dispatch:
    inputs:
      mode:
        description: "poll | heartbeat | test | dry"
        default: poll

permissions:
  contents: write          # needed to commit the DB back

concurrency:
  group: s25-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      CALLMEBOT_PHONE:  ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      NTFY_TOPIC:       ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # cache pip downloads -> faster installs, cheaper runs

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refurb poll (every 30 min, tier-1, no promos)
        if: github.event.schedule == '13,43 * * * *'
        run: python -m src.run --poll --tier1 --no-promos

      - name: Full sweep on demand (all tiers + promos)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'poll'
        run: python -m src.run --poll

      - name: Daily full sweep + heartbeat
        if: github.event.schedule == '0 12 * * *'
        run: |
          python -m src.run --poll --daily
          python -m src.run --heartbeat

      - name: Dry poll (no messages)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry'
        run: python -m src.run --poll --dry-run

      - name: Test alert
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python -m src.run --test-alert

      - name: Commit price snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          git commit -m "data: price snapshot $(date -u +%FT%TZ)" || echo "no changes"
          git push
